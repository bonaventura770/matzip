 function initKakaoMap() {
 const mapContainer = document.getElementById('kakaoMap');
 const mapOption = {
 center: new kakao.maps.LatLng(36.2683, 127.6358), // 대한민국 중심 부근
 level: 13 
 };
 kakaoMap = new kakao.maps.Map(mapContainer, mapOption);

 // 일반 지도와 스카이뷰로 지도 타입을 전환할 수 있는 지도타입 컨트롤을 생성합니다
 const mapTypeControl = new kakao.maps.MapTypeControl();
 kakaoMap.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);

 // 지도 확대 축소를 제어할 수 있는 줌 컨트롤을 생성합니다
 const zoomControl = new kakao.maps.ZoomControl();
 kakaoMap.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

 // 마우스 드래그나 줌 인/아웃 시 툴팁을 숨김 (선택 사항)
 kakao.maps.event.addListener(kakaoMap, 'dragstart', function() {
 document.getElementById('mapTooltip').classList.remove('active');
 });
 }
