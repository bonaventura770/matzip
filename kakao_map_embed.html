<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 지도 임베드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 지도를 담을 영역의 크기를 설정합니다. 필수 요소입니다. */
        #map {
            width: 100%;
            height: 500px;
            border-radius: 0.5rem; /* Tailwind의 rounded-lg와 비슷하게 모서리 둥글게 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">카카오 지도 예제</h1>
        <p class="text-gray-600 mb-6 text-center text-sm">
            제공된 JavaScript 키를 사용하여 지도를 불러옵니다. <br>
            (도메인 설정이 API 키에 맞게 되어 있어야 정상 작동합니다.)
        </p>
        
        <!-- 지도를 표시할 div 입니다 -->
        <div id="map"></div>
    </div>

    <!-- 카카오맵 API 스크립트 로드. 'appkey=' 뒤에 발급받은 JS 키를 넣습니다. -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=00447b8720df593c164f58cfcf04813f"></script>
    
    <script>
        // 지도를 그릴 준비가 되면 실행합니다.
        window.onload = function() {
            // 지도를 담을 DOM 레퍼런스
            var container = document.getElementById('map'); 
            
            // 지도를 생성할 때 필요한 기본 옵션
            var options = {
                // 지도의 중심좌표 (현재 카카오 본사 - 제주도)
                center: new kakao.maps.LatLng(33.450701, 126.570667), 
                // 지도의 확대 레벨
                level: 3 
            };
            
            try {
                // 지도 생성 및 객체 리턴
                var map = new kakao.maps.Map(container, options);
                
                // 중심 좌표에 마커를 생성합니다.
                var markerPosition  = new kakao.maps.LatLng(33.450701, 126.570667); 
                var marker = new kakao.maps.Marker({
                    position: markerPosition
                });
                
                // 마커가 지도 위에 표시되도록 설정합니다
                marker.setMap(map);
                
                // 일반 지도와 스카이뷰로 지도 타입을 전환할 수 있는 지도타입 컨트롤을 생성합니다
                var mapTypeControl = new kakao.maps.MapTypeControl();
                // 지도에 컨트롤을 추가해야 지도위에 표시됩니다
                // kakao.maps.ControlPosition은 컨트롤이 표시될 위치를 정의하는데 TOPRIGHT는 오른쪽 위를 의미합니다
                map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);

                // 지도 확대 축소를 제어할 수 있는  줌 컨트롤을 생성합니다
                var zoomControl = new kakao.maps.ZoomControl();
                map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            } catch (error) {
                console.error("카카오 지도를 불러오는 중 오류가 발생했습니다:", error);
                document.getElementById('map').innerHTML = "<div class='flex items-center justify-center h-full text-red-500'>지도를 불러올 수 없습니다. API 키 도메인 설정을 확인해주세요.</div>";
            }
        };
    </script>
</body>
</html>
